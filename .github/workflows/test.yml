name: Tests

on:
  push:
    branches: [main, "refactor/**", "stack/**"]
  pull_request:
    branches: [main, "stack/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `analysis` (matplotlib, seaborn, scipy, openpyxl) is required now that the
      # run below collects broker/ and the repo-root tests/. Without it
      # broker/tests/test_single_agent_run_flood.py fails at COLLECTION -- it imports
      # examples/single_agent/run_flood.py, which imports matplotlib at module scope --
      # and a collection error aborts the whole session, so the job would go red with
      # one opaque error and no signal from the ~3,200 tests that pass.
      # `llm` is deliberately NOT installed: the LLM-backed tests are deselected below,
      # and the framework is expected to degrade cleanly without a backend, which
      # tests/core/test_llm_backend_absent.py asserts.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .[dev,web,analysis]

      # One step over the whole suite. This previously ran tests/core, tests/sdk and
      # tests/integration as three separate steps, which collected 143 of the 3,250
      # tests in the tree -- every governance test under broker/tests/ and every
      # repo-root tests/*.py file was gated by nothing but someone typing pytest by hand.
      #
      # -ra prints skip reasons, so a module that opts out (the Nature Water figure
      # tests need the gitignored paper/ directory) says so in the log instead of
      # disappearing into a green tick.
      #
      # --continue-on-collection-errors keeps one bad import from blanking the entire
      # run: without it pytest aborts the session and the whole signal is lost.
      - name: Tests (no LLM)
        run: |
          python -m pytest tests/ broker/ -ra --tb=short \
            --continue-on-collection-errors \
            -k "not real_llm"

  scaffold-smoke:
    # Proves the documented onboarding front door -- scaffold_domain ->
    # validate_prompt -> run_experiment.py -- actually runs end to end, on
    # the tool's own untouched defaults, on every push/PR that matches the
    # `on:` branch filters above (main, refactor/**, stack/**). A bare
    # `import {domain}` bug in the generated runner broke exactly this
    # chain silently (no test caught it because no test ran the generated
    # code); this job is the regression guard so that can't happen again
    # unnoticed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (core only -- no LLM/analysis/web extras needed for a mock-mode smoke)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Scaffold a throwaway domain and run its generated runner (mock LLM, 1 step)
        run: |
          python -m broker.tools.scaffold_domain ci_smoke_domain --skills "action_a,action_b"
          python -m broker.tools.validate_prompt examples/ci_smoke_domain_demo/config/agent_types.yaml
          python examples/ci_smoke_domain_demo/run_experiment.py --model mock --years 1 --agents 1
          rm -rf examples/ci_smoke_domain_demo
