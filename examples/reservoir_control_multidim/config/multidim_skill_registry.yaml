# Phase 6W-B7 — reservoir MULTI-DIMENSIONAL control skill registry.
# The operator sets THREE bounded numeric setpoints in one decision (vs the
# single-magnitude reservoir_control). The param_specs block is read by
# broker.interfaces.param_spec.load_param_specs_from_skill_registry and feeds the
# generic ParameterBoundsValidator (AR-6). This is a SEPARATE file from the frozen
# paper-3 skill_registry.yaml — multi-dim setpoints never touch a frozen config.
skills:
  - skill_id: set_release_multi
    category: setpoint
    intensity: continuous
    reversibility: annual
    description: "Set release, hydropower, and flood-pool setpoints for the next operating period"
    eligible_agent_types: ["operator"]
    preconditions: []
    institutional_constraints:
      annual: true
    allowed_state_changes: []
    implementation_mapping: "set_release_multi"
    # Multi-field proposal: each setpoint is a named numeric field the LLM emits.
    output_schema:
      type: object
      # `decision` is parser-ROUTING metadata (the skill is resolved via
      # parsing.skill_map), NOT semantic output — so the output_schema asserts the
      # three SETPOINTS (surfaced by the engine from proposal.parameters), not the
      # routing field. decision stays in properties + response_format so the LLM
      # still emits it for routing.
      required: [release_rate_cms, hydropower_target_mw, flood_pool_pct]
      properties:
        decision: { type: integer, enum: [1] }
        release_rate_cms: { type: number }
        hydropower_target_mw: { type: number }
        flood_pool_pct: { type: number }
    # 6W-B3/B4: per-skill bounded setpoints (coupling VarSpecs; one bounds vocabulary).
    # NOTE: bounds live HERE (validated by ParameterBoundsValidator), NOT in the
    # response_format numeric field (R3) — so the parser never clamps the raw value.
    param_specs:
      - { name: release_rate_cms, unit: cms, lo: 0.0, hi: 850.0 }
      - { name: hydropower_target_mw, unit: MW, lo: 0.0, hi: 2000.0 }
      - { name: flood_pool_pct, unit: pct, lo: 0.0, hi: 100.0 }
    conflicts_with: []

  - skill_id: maintain_release
    category: maintain
    intensity: none
    reversibility: annual
    description: "Maintain the previously committed setpoints"
    eligible_agent_types: ["operator"]
    preconditions: []
    institutional_constraints: {}
    allowed_state_changes: []
    implementation_mapping: "noop"

# Generic non-flood default (INVARIANTS I5 rule 4): a rejected proposal falls
# back to the maintain_release no-op, never the flood-specific 'do_nothing'.
default_skill: maintain_release
