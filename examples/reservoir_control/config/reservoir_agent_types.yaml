# Reservoir continuous-control agent config.
#
# === VARIABLE & UNIT DICTIONARY ===
# Prompt & rule state variables (supplied per year by ops_case.sync_prompt_env):
#   current_year         : [int] 1-based simulation water year
#   storage              : [maf] reservoir storage at the end of the just-finished year
#   storage_now          : [maf] alias of end-of-year storage read by flood_control_overflow
#   spill                : [maf] excess release over capacity during the last water year
#   shortfall            : [maf] unmet annual water demand during the last water year
#   release_actual       : [maf/month] mean monthly release achieved in the last water year
#   inflow_forecast_year : [maf] forecast total inflow for the COMING water year
#   dead_pool            : [maf] minimum physical storage (6.0 maf in ToyMassBalanceReservoir)
#   capacity             : [maf] maximum reservoir capacity (24.0 maf in ToyMassBalanceReservoir)
#   demand_year          : [maf] annual target demand (9.0 maf = 0.75 maf/month * 12)
# LLM response fields & timing:
#   magnitude            : [fraction, 0.0..1.0] monthly release target as a share of demand
#   decision             : [choice, 1|2] 1=set_release (commits magnitude), 2=maintain_release
#   Timing               : hindcast-then-set (year t advances first, then operator sets year t+1)
# ==================================
shared:
  rating_scales:
    utility:
      levels: ["L", "M", "H"]
    generic:
      levels: ["VL", "L", "M", "H", "VH"]
  template_vars:
    - current_year
    - storage
    - spill
    - shortfall
    - release_actual
    - inflow_forecast_year
    - dead_pool
    - capacity
    - demand_year
    # storage_now is not rendered in the prompt body (the prompt shows
    # {storage}) but IS a validation-context dependency of the
    # flood_control_overflow rule below — listed so tooling that
    # enumerates template_vars sees the full dependency set (review S2).
    - storage_now
  response_format:
    delimiter_start: "<<<DECISION_START>>>"
    delimiter_end: "<<<DECISION_END>>>"
    fields:
      - { key: "magnitude", type: "numeric", min: 0, max: 1, unit: "fraction", required: true,
          description: "REQUIRED number from 0 to 1: monthly release as a fraction of demand (0.5 means half, e.g. 0.6)" }
      # Explicit description overrides the format builder's hardcoded
      # "1, 2, or 3" default (this menu has TWO actions; real-LLM e4b
      # finding 2026-06-10).
      - { key: "decision", type: "choice", required: true,
          description: "Numeric ID, choose ONE from: 1 (set_release) or 2 (maintain_release)" }
      - { key: "reasoning", type: "text", required: false }

global_config:
  run:
    # python -m broker.run examples/reservoir_control/config/reservoir_agent_types.yaml
    world: ops_case:build_world
    agents: ops_case:build_agents
    hooks: ops_case:build_hooks
    mock: ops_case:operator_mock
    skill_registry: reservoir_skill_registry.yaml
    governance: strict
    years: 4
    seed: 42
    output: results_ops
    workers: 1   # hooks mutate the shared env dict (INVARIANTS.md AR-3)
  coupling:
    enable: true
  memory:
    window_size: 3
  llm:
    num_ctx: 8192
    num_predict: 1024
    max_retries: 3
  governance:
    domain: reservoir_control
    max_retries: 3
    max_reports_per_retry: 2

operator:
  agent_type: operator
  psychological_framework: utility
  prompt_template: |
    ### RESERVOIR OPERATOR
    Agent ID: {agent_id}
    Year: {current_year}

    ### LAST WATER YEAR OUTCOMES
    - End storage: {storage} maf
    - Spill: {spill} maf
    - Shortfall: {shortfall} maf
    - Mean actual release: {release_actual} maf/month

    ### NEXT OPERATING CONTEXT
    - Forecast annual inflow: {inflow_forecast_year} maf
    - Annual demand: {demand_year} maf
    - Dead pool: {dead_pool} maf
    - Capacity: {capacity} maf

    ### DECISION
    Choose the monthly release as a fraction of demand from 0 to 1.

    ### OPTIONS
    {options_text}

    {response_format}
  response_format:
    delimiter_start: "<<<DECISION_START>>>"
    delimiter_end: "<<<DECISION_END>>>"
    fields:
      - { key: "magnitude", type: "numeric", min: 0, max: 1, unit: "fraction", required: true,
          description: "REQUIRED number from 0 to 1: monthly release as a fraction of demand (0.5 means half, e.g. 0.6)" }
      - { key: "decision", type: "choice", required: true,
          description: "Numeric ID, choose ONE from: 1 (set_release) or 2 (maintain_release)" }
      - { key: "reasoning", type: "text", required: false }
  actions:
    - id: set_release
      aliases: ["1", "set_release", "set release", "release"]
      description: "Set a monthly release target as a fraction of demand (0 to 1)"
    - id: maintain_release
      aliases: ["2", "maintain_release", "maintain release", "maintain"]
      description: "Keep the previous monthly release target"
  parsing:
    decision_keywords: ["decision"]
    default_skill: maintain_release
    strict_mode: true
    skill_map:
      "1": set_release
      "2": maintain_release
  log_fields: []
  governance:
    strict:
      # Physical thresholds on world values and the proposed number are written
      # here as an `expression:` rule (storage_now and capacity come from the
      # reservoir, proposed_magnitude is the number the operator just proposed).
      # The dead-pool limit is a feasibility bound on the coupling contract
      # (ops_case.build_contract), judged on the model's own what-if run.
      thinking_rules:
        - id: flood_control_overflow
          conditions:
            - expression: "storage_now > 0.9 * capacity and proposed_magnitude < 1"
          blocked_skills: [set_release]
          level: ERROR
          message: "set_release below full demand (magnitude 1) is invalid while storage is above 90% capacity; release at least demand for flood control."
      documented_unconstrained_skills:
        - maintain_release
