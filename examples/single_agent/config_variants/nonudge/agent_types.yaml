# =============================================================================
# GLOBAL CONFIGURATION (Experiment-level parameters)
# =============================================================================
global_config:
  # [Cognitive Biology] - Shared mental constraints (Default for all agents)
  memory:
    window_size: 5            # Short-term working memory capacity
    # Flood design record item 9: opt into 5 recent event lines + the 2
    # highest-decayed older event lines. run_flood.py supplies deterministic
    # threshold-0 consolidation, calendar-year decay, and newer-first ties.
    # Missing/false preserves the previous engine selection for legacy arms.
    event_memory_5_2_1: true
    consolidation_threshold: 0.6  # Legacy setting; opt-in flood composition uses 0.0
    consolidation_probability: 0.7 # [Global Param] Probability of transfer to LTM (0.0-1.0)
    top_k_significant: 2      # Active retrieval span
    decay_rate: 0.1           # [Global Param] Forgetting rate (Higher = Faster forgetting)

  # [Cognitive Routine] - Metacognition schedules
  reflection:
    interval: 1               # Reflect every N years
    # 2026-10-07 (flood design record PI decision item 7, Wenyu: "we need to
    # turn reflection on in both cases"): reflection is ON for the WRR26
    # rerun, with the same checks and storage as irrigation. Flood's current
    # 5 + 2 + 1 design also reads the previous reflection's program facts
    # (design record item 8), preserving key years beyond the recent and
    # significant event slots. A WAGF addition listed in the runbook's
    # difference table. `enabled` is read by run_flood.py
    # (_reflection_enabled): it builds the reflection engine alongside the
    # resolved memory engine, and DecisionFilteredMemoryEngine shows the stored
    # reflection AFTER five recent plus up to two significant older event
    # lines (its own slot, not one of the seven). One household per call and only the latest reflection
    # kept, as irrigation.
    enabled: true
    batch_size: 1
    importance_boost: 0.9     # Boost emotional weight for reflected memories
    keep_latest_only: true
    # The grounded mechanism (framework options, default false everywhere
    # else; broker/utils/agent_config.py (AgentTypeConfig.get_reflection_grounding)):
    # the year-end reflection sees the year's own outcome and the house's
    # state at the end of it; one line per year, oldest first; the program
    # writes the key years (the year just ended and the most recent damaged
    # year, examples/single_agent/flood_reflection.py (key_years)) and the
    # model writes only the lesson; a lesson naming a year or any number is
    # retried once, then not stored. Contradictions with a listed year from
    # flood_reflection.check_flood_lesson are report-only flags: never retried
    # or dropped.
    year_outcome: true
    year_lines: true
    program_facts: true
    lesson_no_numbers: true
    persona_instruction: "Speak in the first person (for example, 'I learned that ...') and base your lesson only on the years listed below. Do not say that something happened every year, or never happened, unless every listed year shows it. State a general rule only if no listed year contradicts it."
    questions:
      - "What does your record teach you about protecting your home from floods?"
    triggers:
      crisis: true                    # Triggered by severe flood event
      periodic_interval: 5            # Every 5 years
      decision_types:
        - elevate_house
        - relocate
      institutional_threshold: 0.05   # Policy change > 5%
    method: hybrid

  # [Universe Physics] - LLM & System Generation Settings
  llm:
    model: "command-line-override" # NOTE: Overridden by --model in run scripts
    # 2026-10 WRR26 rerun (spec item 37e, "flood sends gemma3:4b's model-file
    # defaults explicitly ... as irrigation does (spec 7.3), so the manifest
    # records them; this is the same effective sampling as WRR26 sending
    # none"): temperature/top_p/top_k are gemma3:4b's own Ollama Modelfile
    # defaults, written here explicitly (not left for Ollama to fill in
    # silently) so a run's manifest records the sampling settings actually
    # in effect, matching examples/irrigation_abm/config/agent_types.yaml.
    # Previously 0.8/0.9/40 here (hand-set, not the Ollama default despite
    # the old comments), then removed entirely on 2026-10 (that removal's
    # own comment is superseded by this one); the untracked wagf-main-runs
    # config_variants/defaults/ variant made the same removal ad hoc on
    # 2026-09-23. No `seed` key is added: Ollama sampling stays UNSEEDED
    # (disclosed), as irrigation's own comment states. See
    # docs/flood_wrr_rerun_runbook.md.
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    num_ctx: 8192            # Context window size (Optimized for local stability)
    num_predict: 4096         # Max tokens to generate (Extended for DeepSeek R1 thinking)
    max_retries: 2            # Infrastructure resilience

  # [System Governance] - Global Rules
  governance:
    max_retries: 3
    max_reports_per_retry: 3
    # 2026-10 WRR26 rerun (PI decision 2026-10-06 item 5, "8 appraisal freeze
    # on retry (as irrigation)"): every thinking rule reads each construct
    # label as FIRST STATED in the decision, so relabelling on retry cannot
    # pass a rule. Generic framework option (broker/core/_appraisal_freeze.py),
    # default false; irrigation WP3.8 turns it on the same way.
    appraisal_freeze: true
    # 2026-10 WRR26 rerun (coordinator decision on open point 2, following
    # irrigation's own WP3.5/spec 3.5, examples/irrigation_abm/config/
    # agent_types.yaml): no "[Rule: <id>] " prefix in rule messages, so a
    # retry prompt names neither a label value nor an internal rule id.
    # Generic framework option (framework default true);
    # AgentValidator._rule_message reads this off self.rule_id_prefix.
    rule_id_prefix: false
    # Following irrigation's own WP4 (spec 3.7, items 11 and 15): a retry
    # report names the blocked skill in plain words ("elevate house"),
    # never its internal skill id ("elevate_house"). Generic framework
    # option (framework default false).
    plain_action_names: true

  # Retry-prompt provenance (item 13): persist the actual retry-prompt text
  # in the raw JSONL trace so a reviewer can see what the agent was told on
  # a retry (the trace otherwise records only the FIRST prompt). Generic
  # framework option (global_config.audit.retry_prompt_columns), default
  # false everywhere else; the key never reaches the audit CSV (trace_to_csv_row
  # copies named keys only), so only this domain's raw/*.jsonl grows.
  audit:
    retry_prompt_columns: true
    # Post-run IBR (irrigation v3 spec item 37e, the shared IBR family):
    # this records the exact first-parsed-attempt labels (initial_labels)
    # so the analysis function reads them directly instead of inferring a
    # proxy from retry_count + failed_rules (the pre-rerun corpus's only
    # option; see flood_wrr_rerun_runbook.md section 5). Generic framework
    # option (P0-1a), default false; irrigation turns the SAME key on for
    # the SAME reason.
    initial_proposal_columns: true
    # Following irrigation's own spec item 24 fix (CRITICAL 2): the audit
    # schema must not depend on whether a given run happened to hit a parse
    # failure. Without this, SkillBrokerEngine._write_aborted_sentinel_trace
    # writes NO row at all for a decision whose last attempt never parsed
    # (the PR-3 sentinel is itself gated on this flag) -- so a
    # fully-aborted agent-year could be silently MISSING from
    # household_governance_audit.csv entirely, not merely unreadable,
    # shrinking flood_ibr_v2's denominator without a trace of it. Also
    # gives execution_path/executed_skill on every row. Generic framework
    # option, default false.
    corrected_status_columns: true
    # Following irrigation's own WP3 (spec item 19): per attempt, the
    # appraisal labels and the ids of the rules that blocked it
    # (attempt_labels, attempt_failed_rules, in step with attempt_skills),
    # and appraisal_relabeled. Needed so flood_ibr_v2's "first-stated"
    # label can count a construct first stated on a LATER attempt
    # (irrigation's own _first_stated logic), not just attempt 0. Generic
    # framework option, default false.
    attempt_columns: true


# =============================================================================
# SHARED DEFINITIONS (Reusable across agent types)
# =============================================================================
shared:
  rating_scale: |
    ### RATING SCALE (You MUST use EXACTLY one of these codes):
    VL = Very Low | L = Low | M = Medium | H = High | VH = Very High

  # Response Format Definition (for ResponseFormatBuilder)
  response_format:
    delimiter_start: "<<<DECISION_START>>>"
    delimiter_end: "<<<DECISION_END>>>"
    fields:
      # Chain-of-Thought: Reasoning and appraisals FIRST, decision LAST
      - { key: "reasoning", type: "text", required: true, description: "Explain your thought process in 2-3 sentences." }
      - {
          key: "threat_appraisal",
          type: "appraisal",
          required: true,
          construct: "TP_LABEL",
          reason_hint: "One sentence summary of how threatened you feel by any remaining flood risks.",
        }
      - {
          key: "coping_appraisal",
          type: "appraisal",
          required: true,
          construct: "CP_LABEL",
          reason_hint: "One sentence summary of how well you think you can cope or act.",
        }
      # 2026-10 WRR26 rerun (item 4, row C5): "description" removed so the
      # placeholder falls back to ResponseFormatBuilder's dynamic
      # "Numeric ID, choose ONE from: {valid_choices_text}" -- the old
      # literal "(1-4)" was wrong for an elevated household's 3-option menu.
      - { key: "decision", type: "choice", required: true }
      # magnitude_pct / secondary_decision / secondary_magnitude_pct removed
      # (item 4, row C5): the flood model never read them (multi_skill.enabled
      # is false below); WRR26 has no second action or magnitude field.



# =============================================================================
# HOUSEHOLD AGENT TYPE
# =============================================================================
household:
  description: "Household agents making adaptation decisions based on PMT"
  psychological_framework: pmt   # Phase 6J-A: explicit (was inferred from the "household" name substring)
  llm_params:
    # Inherits temperature/top_p/top_k/num_ctx/num_predict from
    # global_config.llm (gemma3:4b's own Modelfile defaults, written there
    # explicitly as of spec item 37e; see that block's comment).
    # temperature: 1.0    # Higher = more diverse, Lower = more deterministic
    # top_p: 0.95         # Nucleus sampling threshold
    # top_k: 50           # Top-k sampling

  # Prompt Template — loaded from external file for maintainability
  # See config/prompts/household.txt for the full prompt
  #
  # Flood design record item 5: household.txt's FIRST
  # line is "{system_prompt}{priority_section}{narrative_persona}", not just
  # "{narrative_persona}". Without "{system_prompt}" somewhere in the
  # template, TieredContextBuilder.format_prompt (broker/components/context/
  # tiered.py) auto-prepends "{system_prompt}\n\n{priority_section}\n\n" --
  # both vars render empty for flood (no SystemPromptProvider or
  # PrioritySchemaProvider in its provider list), so that fallback used to
  # leave 4 bare blank lines at the start of every real prompt sent to the
  # LLM (confirmed via a real trace, not a render-only artifact). Do not
  # remove this prefix from household.txt without re-reading
  # examples/single_agent/tests/test_prompt_rendering.py, the regression
  # guard that runs a real scripted-mock simulation and asserts no prompt
  # (first attempt or retry) starts with "\n".
  prompt_template_file: "config/prompts/household.txt"

  # Parsing & Skill Mapping
  parsing:
    decision_keywords: ["decision", "choice", "action", "selected_action"]
    default_skill: "do_nothing"
    global_skills: ["do_nothing", "buy_insurance", "buy_contents_insurance"]
    full_disclosure: true
    strict_mode: true
    preprocessor:
      { type: "smart_repair", quote_values: ["VL", "L", "M", "H", "VH"] }

    # Extraction Heuristics (Generalized)
    proximity_window: 35
    list_delimiters: ["/", "|", "\\"]

    # Value Normalization (Experiment-specific mapping)
    # normalization: Embedded in ModelAdapter defaults as requested

    # Audit Keywords (Domain-specific keywords moved here from code)
    audit_keywords:
      [
        "flood",
        "water",
        "damage",
        "cost",
        "neighbor",
        "money",
        "safe",
        "protect",
        "elevation",
        "insurance",
        "loss",
      ]
    # Context fields to extract for demographic grounding audit
    audit_context_fields: ["narrative_persona", "flood_experience_summary"]
    # Domain-specific stopwords (added to generic English stopwords)
    audit_blacklist:
      [
        "flood",
        "floods",
        "flooding",
        "risk",
        "water",
        "manageable",
        "resident",
        "household",
      ]
    audit_stopwords: ["flood", "floods", "flooding", "risk", "water"]

    # Synonym Mapping for Construct Extraction (Domain-specific, moved from code)
    synonyms:
      tp:
        [
          "severity",
          "vulnerability",
          "threat",
          "risk",
          "danger",
          "perceived_severity",
          "perceived_vulnerability",
          "consequence",
          "impact",
          "seriousness",
        ]
      cp:
        [
          "efficacy",
          "self_efficacy",
          "response_efficacy",
          "coping",
          "ability",
          "effectiveness",
          "response_cost",
          "preparedness",
          "capacity",
          "suitability",
        ]

    # Baseline Skill Mapping (numeric 1-4)
    skill_map:
      "1": "buy_insurance"
      "2": "elevate_house"
      "3": "relocate"
      "4": "do_nothing"

    skill_map_elevated:
      "1": "buy_insurance"
      "2": "relocate"
      "3": "do_nothing"

    # Construct mappings (Robust Regex for the "M" issue)
    constructs:
      TP_LABEL:
        {
          keywords: ["threat_appraisal", "threat"],
          regex: "(?i)\\b(VL|L|M|H|VH)\\b",
        }
      TP_REASON: { keywords: ["threat_appraisal", "threat"], regex: ".*" }
      CP_LABEL:
        {
          keywords: ["coping_appraisal", "coping"],
          regex: "(?i)\\b(VL|L|M|H|VH)\\b",
        }
      CP_REASON: { keywords: ["coping_appraisal", "coping"], regex: ".*" }

  multi_skill:
    enabled: false
    max_skills: 2
    execution_order: "sequential"
    secondary_field: "secondary_decision"
    secondary_magnitude_field: "secondary_magnitude_pct"

  log_fields: ["threat_appraisal", "coping_appraisal"]

  # Memory Configuration
  memory:
    # --- EXPERIMENT GROUP SETTINGS ---
    # Group A: WindowMemoryEngine (window_size: 5)
    # Group B: WindowMemoryEngine (window_size: 5) + Governance
    # Group C: HumanCentricMemoryEngine (Legacy v1) + Priority Schema (Pillar 3)
    
    engine_type: "human_centric" # Default. Change to "universal" to enable v3 Sudden Surprise.
    window_size: 5
    
    # [Group C / v1 Legacy] Stochastic Consolidation & Decay
    # Only items with Importance >= 0.6 have a chance to enter long-term memory.
    # Memories decay exponentially over time: e^(-decay_rate * age).
    top_k_significant: 2 
    
    # [Group C / v1 Legacy] Importance Calculation
    # Importance = Emotional Weight x Source Weight (Both 0.0 - 1.0)
    emotion_keywords:
      direct_impact:
        ["flood", "flooded", "damage", "destroyed", "loss", "trauma"]
      strategic_choice: ["decision", "grant", "relocate", "elevate", "move"]
      efficacy_gain: ["protected", "safe", "insurance", "saved", "relief"]
      social_feedback: ["trust", "neighbor", "judgment", "observe"]
    emotional_weights:
      direct_impact: 1.0
      strategic_choice: 0.8
      efficacy_gain: 0.6
      social_feedback: 0.4
      baseline_observation: 0.1
    source_weights:
      personal: 1.0
      neighbor: 0.8
      community: 0.6
      general_knowledge: 0.4
    source_patterns:
      personal: ["i ", "my ", "me ", "got flooded", "my house"]
      neighbor: ["neighbor", "others", "friend"]
      community: ["%", "residents", "community", "everyone"]
      
    # [v2 Weighted Model] ONLY active if ranking_mode="weighted"
    # Not used in current JOH Group ABC experiments.
    retrieval_weights:
      recency: 0.3
      importance: 0.5
      context: 0.2

  # [v3 Surprise Engine] ONLY active if engine_type="universal"
    # Inactive for all current JOH Groups (A, B, C).
    arousal_threshold: 0.5  # Surprise trigger
    ema_alpha: 0.3         # Memory adaptation speed

  # Pillar 3: Priority Context Schema (DEACTIVATED for JOH v1 Experiments)
  # priority_schema:
  #   flood_depth: 1.0      # Physical reality (Highest)
  #   flood_threshold: 0.9  # Physical vulnerability
  #   savings: 0.8          # Financial Reality
  #   income_level: 0.7     # Socio-economic Constaint
  #   risk_tolerance: 0.5   # Psychological preference (Lower priority)

  # Available Actions (mapped to Skill Registry IDs)
  actions:
    - id: buy_insurance
      aliases:
        [
          "FI",
          "insurance",
          "buy_insurance",
          "buy flood insurance",
          "Buy flood insurance",
          "[FI]",
          "[insurance]",
          "[buy_insurance]",
          "[buy flood insurance]",
          "[Buy flood insurance]",
        ]
      description: "Buy flood insurance (Lower cost, provides partial financial protection but does not reduce physical damage.)"
    - id: elevate_house
      aliases:
        [
          "HE",
          "elevate",
          "elevation",
          "elevate_house",
          "elevate house",
          "Elevate your house",
          "Elevate house",
          "[HE]",
          "[elevate]",
          "[elevation]",
          "[elevate_house]",
          "[elevate house]",
          "[Elevate your house]",
          "[Elevate house]",
        ]
      description: "Elevate your house (High upfront cost but can prevent most physical damage.)"
    - id: relocate
      aliases:
        [
          "RL",
          "move",
          "relocate",
          "Relocate",
          "[RL]",
          "[move]",
          "[relocate]",
          "[Relocate]",
        ]
      description: "Relocate (Requires leaving your neighborhood but eliminates flood risk permanently.)"
    - id: do_nothing
      aliases:
        [
          "DN",
          "nothing",
          "wait",
          "do_nothing",
          "Do nothing",
          "Do Nothing",
          "[DN]",
          "[nothing]",
          "[wait]",
          "[do_nothing]",
          "[Do nothing]",
          "[Do Nothing]",
        ]
      description: "Do nothing (Require no financial investment or effort this year, but it might leave you exposed to future flood damage.)"

  # Governance Profiles
  governance:
    strict:
      thinking_rules:
        # 2026-10 WRR26 rerun (PI decision 2026-10-06 item 5 / item 10):
        # R1 redefined as threat H/VH AND coping NOT VL/L -- PMT's
        # non-protective-response case (Grothmann and Reusswig 2006 p.106),
        # not threat alone. `values: ["M","H","VH"]` on CP_LABEL expresses
        # "coping not VL or L" (the engine has no categorical NOT-IN; see
        # broker/validators/agent/agent_validator.py _run_rule_set). Message
        # is neutral (item 9): states the judgment in plain words, names no
        # label code, and does not invite relabelling -- the appraisal freeze
        # above makes relabelling moot anyway.
        - {
            id: extreme_threat_block,
            conditions:
              [
                { construct: TP_LABEL, values: ["H", "VH"] },
                { construct: CP_LABEL, values: ["M", "H", "VH"] },
              ],
            blocked_skills: ["do_nothing"],
            level: ERROR,
            message: "Inaction blocked under the rule on severe-threat response: at the start of this decision you judged the flood threat to be high and your coping appraisal was not very low or low, and doing nothing is not available under this rule in that case.",
            suggestion: "Under this rule, doing nothing is not available in this decision.",
          }
        # Realism Rule: Block complex actions if self-efficacy (Coping) is too low
        - {
            id: low_coping_block,
            construct: CP_LABEL,
            conditions: [{ construct: CP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["elevate_house", "relocate"],
            level: WARNING,
            message: "Low coping appraisal: agent perceives low self-efficacy for complex actions.",
          }
        # 2026-10 WRR26 rerun (item 9): neutral retry text, irrigation style
        # (WP3.7) -- states the judgment made at the start of the decision in
        # plain words, names no label code, carries no instruction to change it.
        - {
            id: relocation_threat_low,
            conditions: [{ construct: TP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["relocate"],
            level: ERROR,
            message: "Relocation blocked under the rule on relocating without threat: at the start of this decision you judged the flood threat to be low, and relocating when threat is judged low is not available under this rule.",
            suggestion: "Under this rule, relocating is not available in this decision.",
          }
        - {
            id: elevation_threat_low,
            conditions: [{ construct: TP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["elevate_house"],
            level: ERROR,
            # 2026-10 WRR26 rerun (item 7, item 9): replaces the unfilled
            # "{context.TP_LABEL}" placeholder bug -- AgentValidator._run_rule_set
            # never ran thinking-rule messages through the {context.X}
            # formatter (broker/validators/governance/base_validator.py has
            # that formatter; this rule path does not call it), so the retry
            # prompt showed the literal brace string. Fixed by removing the
            # placeholder rather than wiring the formatter, as irrigation does.
            message: "Elevation blocked under the rule on elevating without threat: at the start of this decision you judged the flood threat to be low, and elevating when threat is judged low is not available under this rule.",
            suggestion: "Under this rule, elevating is not available in this decision.",
          }
      identity_rules:
        - {
            id: elevation_block,
            precondition: elevated,
            blocked_skills: ["elevate_house"],
            level: ERROR,
          }

    relaxed:
      thinking_rules:
        - {
            construct: TP_LABEL,
            when_above: ["H"],
            blocked_skills: ["do_nothing"],
            level: WARNING,
          }
      identity_rules:
        - {
            id: elevation_block,
            precondition: elevated,
            blocked_skills: ["elevate_house"],
            level: WARNING,
          }

    # Ablation: strict minus extreme_threat_block (Paper 1b R2)
    # This profile's own copies of relocation_threat_low/elevation_threat_low
    # had not been updated alongside strict/grounded_v1 and still carried the
    # unfilled "{context.TP_LABEL}" placeholder bug (item 7) and the old,
    # label-pointing wording (item 9). Brought in line with strict's
    # neutral text, not run in this corpus (it is the R1-ablation profile,
    # kept consistent so it is not a stale landmine).
    strict_no_etb:
      thinking_rules:
        - {
            id: low_coping_block,
            construct: CP_LABEL,
            conditions: [{ construct: CP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["elevate_house", "relocate"],
            level: WARNING,
            message: "Low coping appraisal: agent perceives low self-efficacy for complex actions.",
          }
        - {
            id: relocation_threat_low,
            conditions: [{ construct: TP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["relocate"],
            level: ERROR,
            message: "Relocation blocked under the rule on relocating without threat: at the start of this decision you judged the flood threat to be low, and relocating when threat is judged low is not available under this rule.",
            suggestion: "Under this rule, relocating is not available in this decision.",
          }
        - {
            id: elevation_threat_low,
            conditions: [{ construct: TP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["elevate_house"],
            level: ERROR,
            message: "Elevation blocked under the rule on elevating without threat: at the start of this decision you judged the flood threat to be low, and elevating when threat is judged low is not available under this rule.",
            suggestion: "Under this rule, elevating is not available in this decision.",
          }
      identity_rules:
        - {
            id: elevation_block,
            precondition: elevated,
            blocked_skills: ["elevate_house"],
            level: ERROR,
          }

    # PR-6: strict, PLUS world-grounded ERROR rules.
    #
    # Every rule in `strict` conditions only on a label the model emitted in the
    # same generation, so the rule checks one JSON object against itself: an
    # agent that reports low threat is never contradicted, however often its
    # parcel actually floods. `grounded_v1` keeps those rules verbatim — it is
    # additive, not a replacement — and adds one whose antecedent is simulator
    # state the model cannot author.
    #
    # Select with `--governance-mode grounded_v1`.
    grounded_v1:
      thinking_rules:
        # Kept verbatim with the redefined `strict` rule set above (not run
        # in this corpus; kept consistent so it is not a stale landmine).
        - {
            id: extreme_threat_block,
            conditions:
              [
                { construct: TP_LABEL, values: ["H", "VH"] },
                { construct: CP_LABEL, values: ["M", "H", "VH"] },
              ],
            blocked_skills: ["do_nothing"],
            level: ERROR,
            message: "Inaction blocked under the rule on severe-threat response: at the start of this decision you judged the flood threat to be high and your coping appraisal was not very low or low, and doing nothing is not available under this rule in that case.",
            suggestion: "Under this rule, doing nothing is not available in this decision.",
          }
        - {
            id: low_coping_block,
            construct: CP_LABEL,
            conditions: [{ construct: CP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["elevate_house", "relocate"],
            level: WARNING,
            message: "Low coping appraisal: agent perceives low self-efficacy for complex actions.",
          }
        - {
            id: relocation_threat_low,
            conditions: [{ construct: TP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["relocate"],
            level: ERROR,
            message: "Relocation blocked under the rule on relocating without threat: at the start of this decision you judged the flood threat to be low, and relocating when threat is judged low is not available under this rule.",
            suggestion: "Under this rule, relocating is not available in this decision.",
          }
        - {
            id: elevation_threat_low,
            conditions: [{ construct: TP_LABEL, values: ["VL", "L"] }],
            blocked_skills: ["elevate_house"],
            level: ERROR,
            message: "Elevation blocked under the rule on elevating without threat: at the start of this decision you judged the flood threat to be low, and elevating when threat is judged low is not available under this rule.",
            suggestion: "Under this rule, elevating is not available in this decision.",
          }
        # WORLD-GROUNDED. The first condition reads `flood_event`, which the
        # simulation publishes in the environment context each year; the agent
        # has no way to write it. The rule therefore fires exactly when the
        # world contradicts the self-report — a flood happened AND the agent
        # rated the threat low AND chose to do nothing about it. `scope: env`
        # is explicit because the broker flattens agent state and environment
        # into one dict, and a name carried by both would otherwise resolve to
        # whichever won that merge.
        - id: observed_flood_low_threat_inaction
          grounding: world
          conditions:
            - { variable: flood_event, scope: env, operator: is_true }
            - { construct: TP_LABEL, values: ["VL", "L"] }
          blocked_skills: ["do_nothing"]
          level: ERROR
          message: "Inaction blocked: a flood occurred this year, which your own low threat rating does not account for. Re-appraise the threat against what happened, then choose."
      identity_rules:
        - {
            id: elevation_block,
            precondition: elevated,
            blocked_skills: ["elevate_house"],
            level: ERROR,
          }

    disabled:
      thinking_rules: []
      identity_rules: []

