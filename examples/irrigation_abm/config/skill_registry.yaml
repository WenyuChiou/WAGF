# Irrigation ABM Skill Registry
# Defines available skills for Colorado River Basin irrigation farmers.
# Adapted from Hung & Yang (2021) RL-ABM-CRSS framework — LLM-driven version.
#
# v17: Expanded from 3 to 5 skills for graduated demand adjustment.
# 2026-09-26: descriptions are the prompt's option text (options_text); step
# sizes follow the Hung and Yang (2021) action model in irrigation_env.py
# (no percentage bands, no magnitude fields).
# Differential governance: Tier 1 blocks increase_large but allows increase_small.

skills:
  - skill_id: increase_large
    # Phase 6O-B action taxonomy
    category: increase
    intensity: large
    reversibility: annual
    description: "Increase your diversion request by a large step."
    eligible_agent_types: ["irrigation_farmer"]
    preconditions:
      - "not at_allocation_cap"
    institutional_constraints:
      annual: true
    allowed_state_changes:
      - request
      - diversion
    implementation_mapping: "env.execute_skill"
    output_schema:
      type: object
      required: [decision]
      properties:
        decision: { type: integer, enum: [1, 2, 3, 4, 5] }
    conflicts_with: []

  - skill_id: increase_small
    # Phase 6O-B action taxonomy
    category: increase
    intensity: small
    reversibility: annual
    description: "Increase your diversion request by a small step."
    eligible_agent_types: ["irrigation_farmer"]
    preconditions:
      - "not at_allocation_cap"
    institutional_constraints:
      annual: true
    allowed_state_changes:
      - request
      - diversion
    implementation_mapping: "env.execute_skill"
    output_schema:
      type: object
      required: [decision]
      properties:
        decision: { type: integer, enum: [1, 2, 3, 4, 5] }
    conflicts_with: []

  - skill_id: maintain_demand
    # Phase 6O-B action taxonomy
    category: maintain
    intensity: none
    reversibility: annual
    description: "Keep your request unchanged."
    eligible_agent_types: ["irrigation_farmer"]
    preconditions: []
    institutional_constraints: {}
    allowed_state_changes: []
    implementation_mapping: "env.execute_skill"
    output_schema:
      type: object
      required: [decision]
      properties:
        decision: { type: integer, enum: [1, 2, 3, 4, 5] }
    conflicts_with: []

  - skill_id: decrease_small
    # Phase 6O-B action taxonomy
    category: decrease
    intensity: small
    reversibility: annual
    description: "Reduce your diversion request by a small step."
    eligible_agent_types: ["irrigation_farmer"]
    preconditions: []
    institutional_constraints:
      annual: true
    allowed_state_changes:
      - request
      - diversion
    implementation_mapping: "env.execute_skill"
    output_schema:
      type: object
      required: [decision]
      properties:
        decision: { type: integer, enum: [1, 2, 3, 4, 5] }
    conflicts_with: []

  - skill_id: decrease_large
    # Phase 6O-B action taxonomy
    category: decrease
    intensity: large
    reversibility: annual
    description: "Reduce your diversion request by a large step."
    eligible_agent_types: ["irrigation_farmer"]
    preconditions: []
    institutional_constraints:
      annual: true
    allowed_state_changes:
      - request
      - diversion
    implementation_mapping: "env.execute_skill"
    output_schema:
      type: object
      required: [decision]
      properties:
        decision: { type: integer, enum: [1, 2, 3, 4, 5] }
    conflicts_with: []

default_skill: maintain_demand
